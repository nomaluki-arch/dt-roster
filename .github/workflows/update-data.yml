name: Update Dragon Traveler data
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest data from dtwiki
        run: |
          curl -fsSL "https://dtwiki.org/data/global/tier-lists.json" -o tier-lists.json
          curl -fsSL "https://dtwiki.org/data/enUS/characters.json"   -o characters.json
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tier-lists.json characters.json
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
