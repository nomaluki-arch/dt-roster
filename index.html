<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Traveler — Roster Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101019; --ink-2:#15151f; --panel:#1b1c28; --panel-2:#20222f;
    --line:#2c2e3d; --line-soft:#24262f;
    --text:#ece7db; --muted:#8b8fa3; --muted-2:#6a6e80;
    --ember:#e0a33e; --ember-hot:#f2b64a; --ember-glow:rgba(224,163,62,.35);
    --tier-SS:#c0392b; --tier-Splus:#e05a3e; --tier-S:#e0803e;
    --tier-Aplus:#d9a441; --tier-A:#c9b458; --tier-Bplus:#5cb37a;
    --tier-B:#3fa564; --tier-C:#4f97c2; --tier-D:#7f8598; --tier-F:#7f8598;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #1a1b2a 0%, transparent 60%),
      radial-gradient(900px 500px at -5% 0%, #1c1526 0%, transparent 55%),
      var(--ink);
    color:var(--text); font-family:Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px}

  /* header */
  header.top{position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(16,16,25,.96), rgba(16,16,25,.82));
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line-soft)}
  .top-inner{display:flex; align-items:center; gap:18px; padding:16px 20px; max-width:1180px; margin:0 auto; flex-wrap:wrap}
  .brand{display:flex; flex-direction:column; gap:2px; margin-right:auto}
  .brand h1{font-family:Fraunces,serif; font-weight:900; font-size:26px; letter-spacing:.2px; margin:0; line-height:1}
  .brand .ember{color:var(--ember)}
  .brand p{margin:0; color:var(--muted); font-size:12.5px; letter-spacing:.3px}
  .src{display:flex; align-items:center; gap:10px}
  .datastate{font-size:11.5px; color:var(--muted-2); text-align:right; line-height:1.3}
  .datastate b{color:var(--muted); font-weight:600}
  button.refresh{
    font:inherit; font-size:13px; font-weight:600; color:var(--ink);
    background:linear-gradient(180deg,var(--ember-hot),var(--ember));
    border:none; border-radius:9px; padding:9px 14px; cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 6px 16px -8px var(--ember-glow)}
  button.refresh:disabled{opacity:.6; cursor:progress}
  button.refresh:focus-visible{outline:2px solid var(--ember-hot); outline-offset:2px}
  .databtn{font:inherit; font-size:12px; font-weight:500; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 11px; cursor:pointer}
  .databtn:hover{color:var(--text); border-color:var(--ember)}
  .databtn:focus-visible{outline:2px solid var(--ember); outline-offset:1px}

  /* meter */
  .meterband{border-bottom:1px solid var(--line-soft); background:var(--ink-2)}
  .meter{display:flex; align-items:center; gap:22px; padding:16px 20px; max-width:1180px; margin:0 auto; flex-wrap:wrap}
  .bigcount{display:flex; align-items:baseline; gap:8px}
  .bigcount .n{font-family:Fraunces,serif; font-weight:900; font-size:34px; color:var(--ember); line-height:1}
  .bigcount .d{color:var(--muted); font-size:14px}
  .bigcount .lbl{color:var(--muted-2); font-size:11px; text-transform:uppercase; letter-spacing:.14em; margin-left:6px}
  .bar{flex:1 1 240px; height:9px; background:#242634; border-radius:99px; overflow:hidden; min-width:180px}
  .bar > i{display:block; height:100%; width:0;
    background:linear-gradient(90deg,var(--ember),var(--ember-hot)); border-radius:99px;
    box-shadow:0 0 12px var(--ember-glow); transition:width .5s ease}
  .pills{display:flex; gap:14px; flex-wrap:wrap}
  .pill{font-size:12px; color:var(--muted)}
  .pill b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums}

  /* controls */
  .viewtabs{display:flex; gap:2px; border-bottom:1px solid var(--line-soft); margin:16px 0 0}
  .vtab{font-family:Fraunces,serif; font-size:15px; font-weight:600; color:var(--muted); background:none; border:none;
    padding:10px 14px; cursor:pointer; position:relative; display:inline-flex; align-items:center; gap:7px}
  .vtab[aria-pressed="true"]{color:var(--text)}
  .vtab[aria-pressed="true"]::after{content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2px; background:var(--ember); border-radius:2px}
  .vtab:hover{color:var(--text)}
  .vtab:focus-visible{outline:2px solid var(--ember); outline-offset:2px; border-radius:6px}
  .vtab.matrixtab svg{opacity:.6}
  .letter.az{background:var(--panel-2); color:var(--muted)}
  .rail .classlabel{font-family:Inter,sans-serif; font-weight:600; font-size:12.5px; padding:6px 10px; border-radius:8px; background:var(--panel-2); color:var(--text); white-space:nowrap; text-align:center}
  .fdot{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; vertical-align:middle; border:1px solid rgba(255,255,255,.18)}
  .controls{display:flex; gap:12px; align-items:center; padding:12px 0 4px; flex-wrap:wrap}
  .seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px}
  .seg button{font:inherit; font-size:12.5px; font-weight:500; color:var(--muted); background:none; border:none;
    padding:7px 12px; border-radius:7px; cursor:pointer; white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--panel-2); color:var(--text); box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
  .seg button:focus-visible{outline:2px solid var(--ember); outline-offset:1px}
  .search{flex:1 1 200px; min-width:160px; position:relative}
  .search input{width:100%; font:inherit; font-size:13.5px; color:var(--text); background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:9px 12px 9px 32px}
  .search input::placeholder{color:var(--muted-2)}
  .search input:focus{outline:none; border-color:var(--ember); box-shadow:0 0 0 3px rgba(224,163,62,.12)}
  .search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.5}
  .toggle{font:inherit; font-size:12.5px; color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
  .toggle[aria-pressed="true"]{color:var(--ink); background:linear-gradient(180deg,var(--ember-hot),var(--ember)); border-color:transparent; font-weight:600}
  .toggle:focus-visible{outline:2px solid var(--ember); outline-offset:1px}

  .filtergroups{display:flex; flex-direction:column; gap:7px; padding:8px 0 2px}
  .fgroup{display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap}
  .flabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted-2); min-width:54px; padding-top:6px}
  .rarityfilter{display:flex; gap:6px; flex-wrap:wrap; flex:1}
  .rchip{font:inherit; font-size:11.5px; font-weight:600; letter-spacing:.02em; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:5px 11px; cursor:pointer}
  .rchip[aria-pressed="true"]{color:var(--text); border-color:var(--ember); background:var(--panel-2)}
  .rchip:focus-visible{outline:2px solid var(--ember); outline-offset:1px}

  .listnote{color:var(--muted-2); font-size:12px; padding:4px 0 10px}

  /* tier bands */
  .band{display:grid; grid-template-columns:96px 1fr; gap:16px; border-top:1px solid var(--line-soft); padding:16px 0}
  .band:first-of-type{border-top:none}
  .rail{display:flex; flex-direction:column; gap:4px; align-items:flex-start; position:sticky; top:78px; align-self:start; height:min-content}
  .rail .letter{font-family:Fraunces,serif; font-weight:900; font-size:30px; line-height:1;
    padding:4px 12px; border-radius:9px; color:#0e0e15}
  .rail .meta{font-size:11px; color:var(--muted-2)}
  .rail .meta b{color:var(--muted); font-variant-numeric:tabular-nums; font-weight:600}
  .rail .def{font-size:11px; color:var(--muted-2); line-height:1.35; max-width:170px}
  .units{display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start}

  .unit{position:relative; display:inline-flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:99px;
    padding:7px 13px 7px 11px; cursor:pointer; font:inherit; color:var(--text);
    transition:border-color .12s, transform .06s, background .12s}
  .unit:hover{border-color:#3a3d4f; transform:translateY(-1px)}
  .unit:focus-visible{outline:2px solid var(--ember); outline-offset:2px}
  .unit .dot{width:9px; height:9px; border-radius:99px; background:#3a3d4f; flex:none; transition:background .12s, box-shadow .12s}
  .unit .nm{font-size:13px; font-weight:500; white-space:nowrap}
  .unit .rar{font-size:9.5px; font-weight:700; letter-spacing:.05em; color:var(--muted-2);
    border:1px solid var(--line); border-radius:5px; padding:1px 5px; white-space:nowrap}
  .unit.owned{background:linear-gradient(180deg, rgba(224,163,62,.16), rgba(224,163,62,.06));
    border-color:var(--ember)}
  .unit.owned .dot{background:var(--ember-hot); box-shadow:0 0 0 3px var(--ember-glow)}
  .unit.owned .nm{color:#fbeccb}
  .unit.owned .rar{color:var(--ember); border-color:rgba(224,163,62,.5)}

  .empty{color:var(--muted-2); font-size:13px; padding:8px 0}

  /* tooltip */
  .tip{position:fixed; z-index:60; max-width:320px; background:#0c0c14; border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; box-shadow:0 20px 50px -20px #000; pointer-events:none; opacity:0;
    transition:opacity .12s; font-size:12.5px}
  .tip.show{opacity:1}
  .tip h4{margin:0 0 2px; font-family:Fraunces,serif; font-size:15px; font-weight:600}
  .tip .sub{color:var(--ember); font-size:11px; margin-bottom:7px}
  .tip .fac{color:var(--muted); font-size:11px; margin-bottom:7px}
  .tip .sum{color:var(--muted); line-height:1.5}
  .tip .none{color:var(--muted-2); font-style:italic}

  footer{color:var(--muted-2); font-size:12px; border-top:1px solid var(--line-soft); margin-top:24px; padding:18px 0 40px}
  footer a{color:var(--muted)}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#0c0c14; border:1px solid var(--line); color:var(--text); padding:11px 16px; border-radius:10px;
    font-size:13px; box-shadow:0 20px 50px -20px #000; opacity:0; transition:opacity .2s, transform .2s; z-index:80}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    .band{grid-template-columns:1fr; gap:8px}
    .rail{position:static; flex-direction:row; align-items:center; gap:10px}
    .rail .def{display:none}
    .brand h1{font-size:22px}
  }
  /* invest flag */
  :root{--invest:#a98cff; --invest-soft:rgba(169,140,255,.16)}
  .unit .flag{margin-left:1px; width:20px; height:20px; border-radius:6px; border:1px solid var(--line);
    background:transparent; color:var(--muted-2); display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none}
  .unit .flag:hover{border-color:var(--invest); color:var(--invest)}
  .unit .flag:focus-visible{outline:2px solid var(--invest); outline-offset:1px}
  .unit.invest{box-shadow:inset 3px 0 0 0 var(--invest)}
  .unit.invest .flag{color:var(--invest); border-color:var(--invest); background:var(--invest-soft)}
  .pill.invest b{color:var(--invest)}

  /* analytics */
  .analytics{display:none; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); padding:18px; margin:8px 0 12px}
  .analytics.show{display:block}
  .ahead{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:12px}
  .analytics h2{font-family:Fraunces,serif; font-size:18px; font-weight:600; margin:0}
  .analytics .lead{color:var(--muted); font-size:12.5px; margin:2px 0 0}
  .incl{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); margin-left:auto; cursor:pointer; white-space:nowrap}
  .incl input{accent-color:var(--invest); width:15px; height:15px}
  .verdict{font-size:14px; margin:0 0 14px; padding:12px 14px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line)}
  .verdict b{color:var(--ember)}
  .facgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-bottom:16px}
  .facrow{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--ink-2)}
  .facrow.ready{border-color:rgba(224,163,62,.45)}
  .facrow .fn{font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center}
  .facrow .fn .cnt{font-variant-numeric:tabular-nums; color:var(--ember)}
  .roles{display:flex; gap:10px; margin-top:6px; font-size:11px; color:var(--muted)}
  .roles b{font-weight:600}
  .roles .ok{color:#5cb37a} .roles .no{color:var(--muted-2)}
  .teamcard{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:var(--ink-2)}
  .teamcard .th{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  .teamcard .th .tt{font-family:Fraunces,serif; font-size:15px; font-weight:600}
  .teamcard .th .anchor{color:var(--ember); font-size:12px}
  .teamcard .miss{color:#e05a3e; font-size:11.5px; margin-top:8px}
  .lineup{display:flex; flex-wrap:wrap; gap:6px}
  .slot{display:inline-flex; align-items:center; gap:6px; font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px 9px}
  .slot .r{font-size:9px; letter-spacing:.05em; color:var(--muted-2); border:1px solid var(--line); border-radius:4px; padding:0 4px}
  .slot.core{border-color:rgba(224,163,62,.5)}
  .slot.flex{opacity:.82}
  .contested{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px}
  .contested .cu{font-size:12px; background:var(--panel); border:1px dashed var(--invest); color:var(--text); border-radius:8px; padding:4px 9px}
  .contested .cu span{color:var(--muted-2)}
  .anote{color:var(--muted-2); font-size:11.5px; margin-top:12px}
  .acontrols{display:flex; align-items:center; gap:10px; margin-left:auto; flex-wrap:wrap}
  .asel{font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:6px}
  .asel select{font:inherit; font-size:12px; color:var(--text); background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 8px}
  .toggle.small{padding:6px 10px; font-size:12px}
  .matrixwrap{overflow-x:auto; padding-bottom:2px}
  table.matrix{border-collapse:separate; border-spacing:3px; font-size:12px}
  table.matrix th{color:var(--muted); font-weight:600; font-size:11px; padding:4px 6px; text-align:center; white-space:nowrap}
  table.matrix tbody th{text-align:right; position:sticky; left:0; background:var(--panel); z-index:1}
  table.matrix td{min-width:50px; height:38px; text-align:center; border-radius:7px; color:var(--text);
    font-variant-numeric:tabular-nums; font-weight:600; border:1px solid var(--line-soft)}
  table.matrix td.diag{outline:1.5px solid var(--ember); outline-offset:-2px}
  table.matrix td .pcts{font-size:9px; color:var(--muted-2); font-weight:400; margin-left:1px}
  .combos{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:14px}
  .combo h3{font-family:Fraunces,serif; font-size:14px; font-weight:600; margin:0 0 4px}
  .combo ol{margin:0; padding:0; list-style:none; counter-reset:c}
  .combo li{counter-increment:c; display:flex; align-items:baseline; gap:10px; padding:6px 0;
    border-bottom:1px solid var(--line-soft); font-size:12.5px}
  .combo li::before{content:counter(c); color:var(--muted-2); font-size:10px; width:12px; flex:none}
  .combo li span{color:var(--text); flex:1}
  .combo li b{color:var(--ember); font-variant-numeric:tabular-nums}
  @media (max-width:640px){ .combos{grid-template-columns:1fr} }

  /* teams */
  .poolwrap{margin-top:14px}
  .poolhead{display:flex; flex-direction:column; gap:8px; font-size:12px; color:var(--muted); margin-bottom:8px}
  .teamactions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .tbtn{font:inherit; font-size:11.5px; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer}
  .tbtn:hover{border-color:var(--ember); color:var(--text)}
  .savedteam{display:inline-flex; align-items:center; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .savedteam:hover{border-color:var(--ember)}
  .savedteam .snm{font:inherit; font-size:11.5px; color:var(--text); background:none; border:none; padding:6px 4px 6px 10px; cursor:pointer; white-space:nowrap}
  .savedteam .del{font:inherit; color:var(--muted-2); background:none; border:none; font-size:14px; line-height:1; padding:5px 8px; cursor:pointer}
  .savedteam .del:hover{color:#e05a3e}
  .teampool{display:flex; flex-wrap:wrap; gap:6px; max-height:200px; overflow-y:auto; padding:8px; border:1px solid var(--line-soft); border-radius:10px; background:var(--ink-2)}
  .poolchip{display:inline-flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:5px 11px; cursor:grab; font:inherit; color:var(--text)}
  .poolchip:active{cursor:grabbing}
  .poolchip.sel{outline:2px solid var(--ember); outline-offset:1px}
  .poolchip.owned{border-color:var(--ember); background:linear-gradient(180deg, rgba(224,163,62,.16), rgba(224,163,62,.05))}
  .poolchip.owned .nm{color:#fbeccb}
  .poolchip.invest{box-shadow:inset 3px 0 0 0 var(--invest)}
  .poolchip .iflag{display:inline-flex; color:var(--invest)}
  .poolchip .iflag svg{width:11px; height:11px}
  .poolchip .nm{font-size:12.5px; white-space:nowrap}
  .poolchip .rar{font-size:9px; font-weight:700; color:var(--muted-2); border:1px solid var(--line); border-radius:4px; padding:0 4px}
  .boards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:16px}
  .board{border:1px solid var(--line); border-radius:10px; padding:10px 11px; background:var(--panel)}
  .boardhead{font-family:Fraunces,serif; font-weight:600; font-size:14px; margin-bottom:8px; display:flex; align-items:center}
  .board3{display:grid; grid-template-columns:14px repeat(3,1fr); grid-template-rows:12px repeat(3,1fr); gap:4px}
  .board3 .cl{font-size:8.5px; color:var(--muted-2); text-align:center; letter-spacing:.06em}
  .board3 .rl{font-size:8.5px; color:var(--muted-2); display:flex; align-items:center; justify-content:center}
  .cell{border:1px dashed var(--line); border-radius:7px; min-height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px; padding:3px; cursor:pointer}
  .cell.over{border-color:var(--ember); background:rgba(224,163,62,.12)}
  .cell.filled{border-style:solid; background:var(--panel-2)}
  .cell.ok{border-color:var(--ember); background:rgba(224,163,62,.08)}
  .cell.no{opacity:.32}
  .cell .cu{font-size:10.5px; line-height:1.15; color:var(--text); word-break:break-word}
  .cicon{width:16px; height:16px; object-fit:contain; flex:none; pointer-events:none}
  .unit .cicon{width:15px; height:15px; margin:0 1px}
  .cell .cicon{width:15px; height:15px}
  @media (max-width:900px){ .boards{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:560px){ .boards{grid-template-columns:1fr} }

  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Dragon Traveler <span class="ember">Roster Codex</span></h1>
      <p>Mark what you own · ranked across four community tier lists</p>
    </div>
    <div class="src">
      <div class="datastate" id="datastate">Loading data&hellip;</div>
      <button class="databtn" id="exportBtn" title="Download your roster as a backup file">Export</button>
      <button class="databtn" id="importBtn" title="Load a roster backup file">Import</button>
      <input type="file" id="importFile" accept=".json,.txt,application/json" style="display:none">
      <button class="refresh" id="refresh">Refresh</button>
    </div>
  </div>
</header>

<div class="meterband">
  <div class="meter">
    <div class="bigcount"><span class="n" id="ownN">0</span><span class="d" id="ownD">/ 0</span><span class="lbl">owned</span></div>

const RARITY_ORDER = ["SSR EX","SSR+","SSR","SR","R","N"];

function titleCase(s){ return s.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }
function parseSlug(slug){
  for(const [suf,label] of RARITY_SUFFIX){ if(slug.endsWith(suf)) return {name:titleCase(slug.slice(0,-suf.length)), rarity:label}; }
  return {name:titleCase(slug), rarity:""};
}
function rarityRank(r){ const i=RARITY_ORDER.indexOf(r); return i<0?99:i; }

/* ---- storage: window.storage in Claude, localStorage standalone ---- */
async function saveKey(key,set){
  const data=JSON.stringify([...set]);
  if(window.storage){ try{ await window.storage.set(key,data,false); return; }catch(e){} }
  try{ localStorage.setItem(key,data); }catch(e){}
}
async function loadKey(key){
  if(window.storage){ try{ const r=await window.storage.get(key,false); if(r&&r.value) return new Set(JSON.parse(r.value)); }catch(e){} }
  try{ const v=localStorage.getItem(key); if(v) return new Set(JSON.parse(v)); }catch(e){}
  return new Set();
}
async function saveJSON(key,val){
  const d=JSON.stringify(val);
  if(window.storage){ try{ await window.storage.set(key,d,false); return; }catch(e){} }
  try{ localStorage.setItem(key,d); }catch(e){}
}
async function loadJSON(key,fb){
  if(window.storage){ try{ const r=await window.storage.get(key,false); if(r&&r.value) return JSON.parse(r.value); }catch(e){} }
  try{ const v=localStorage.getItem(key); if(v) return JSON.parse(v); }catch(e){}
  return fb;
}

/* ---- model built from either snapshot or live (same shape) ---- */
function buildModel(tierLists, characters){
  const charBySlug={}; characters.forEach(c=>charBySlug[c.slug]=c);
  const lists=tierLists.map(tl=>({
    name:tl.name, author:tl.author||"", content:tl.content_type||"", description:tl.description||"",
    tierOrder:(tl.tiers||[]).map(t=>t.name),
    tierNote:Object.fromEntries((tl.tiers||[]).map(t=>[t.name,t.note||""])),
    tierOf:Object.fromEntries((tl.entries||[]).map(e=>[e.character_slug,e.tier])),
    noteOf:Object.fromEntries((tl.entries||[]).filter(e=>e.note).map(e=>[e.character_slug,e.note])),
  }));
  const slugs=new Set();
  lists.forEach(l=>Object.keys(l.tierOf).forEach(s=>slugs.add(s)));
  characters.forEach(c=>slugs.add(c.slug));
  const units=[...slugs].map(slug=>{
    const c=charBySlug[slug]; const p=parseSlug(slug);
    return { slug, name:(c&&c.name)||p.name, rarity:(c&&c.quality)||p.rarity,
      cls:(c&&c.character_class)||"", factions:(c&&c.factions)||[],
      recs:(c&&c.recommended_subclasses)||[], summary:(c&&c.summary)||"" };
  });
  return {lists, units, bySlug:Object.fromEntries(units.map(u=>[u.slug,u]))};
}

/* ---- state ---- */
let MODEL=null;
let owned=new Set();
let invest=new Set();
let view="tiers";
let teams=null;
let savedTeams=[];
let selectedPoolSlug=null;
let selectedList=null;
const filters={search:"", rarities:new Set(RARITY_ORDER), classes:new Set(CLASSES), factions:new Set(FACTIONS), ownedOnly:false, investOnly:false};

/* ---- rendering ---- */
const $=id=>document.getElementById(id);

function currentList(){ return MODEL.lists.find(l=>l.name===selectedList)||MODEL.lists[0]; }

function passesFilter(u){
  if(!filters.rarities.has(u.rarity)) return false;
  if(filters.classes.size<CLASSES.length && !(u.cls && filters.classes.has(u.cls))) return false;
  if(filters.factions.size<FACTIONS.length && !u.factions.some(f=>filters.factions.has(f))) return false;
  if(filters.ownedOnly && !owned.has(u.slug)) return false;
  if(filters.investOnly && !invest.has(u.slug)) return false;
  if(filters.search && !u.name.toLowerCase().includes(filters.search)) return false;
  return true;
}

function renderListSeg(){
  const seg=$("listseg"); seg.innerHTML="";
  MODEL.lists.forEach(l=>{
    const b=document.createElement("button");
    b.textContent=l.name; b.setAttribute("aria-pressed", l.name===selectedList);
    b.onclick=()=>{ selectedList=l.name; renderAll(); };
    seg.appendChild(b);
  });
}
function renderNote(){
  const l=currentList();
  $("listnote").textContent = [l.author&&("by "+l.author), l.content, l.description].filter(Boolean).join("  ·  ");
}
function renderRarityFilter(){
  renderChips("rarityfilter", RARITY_ORDER, filters.rarities);
  renderChips("classfilter", CLASSES, filters.classes, titleCase);
  renderChips("factionfilter", FACTIONS, filters.factions, titleCase, FACTION_COLOR);
}
function renderChips(boxId, values, set, labelFn, colorMap){
  const box=$(boxId); if(!box) return; box.innerHTML="";
  values.forEach(v=>{
    const b=document.createElement("button"); b.className="rchip";
    const label=labelFn?labelFn(v):v;
    b.innerHTML=(colorMap?`<span class="fdot" style="background:${colorMap[v]}"></span>`:"")+label;
    b.title=label;
    b.setAttribute("aria-pressed", set.has(v));
    b.onclick=()=>{ set.has(v)?set.delete(v):set.add(v);
      b.setAttribute("aria-pressed", set.has(v)); renderView(); renderStats(); };
    box.appendChild(b);
  });
}

function afterChange(){
  renderStats();
  if(view==="matrix"){ renderAnalytics(); return; }
  if(filters.ownedOnly||filters.investOnly) renderRoster(); else updateRailCounts();
}
function updateRailCounts(){
  document.querySelectorAll(".band").forEach(band=>{
    const total=band.querySelectorAll(".units .unit").length;
    const own=band.querySelectorAll(".units .unit.owned").length;
    const meta=band.querySelector(".rail .meta");
    if(meta) meta.innerHTML=`<b>${own}</b> / ${total} owned`;
  });
}
function unitEl(u){
  const b=document.createElement("button");
  b.className="unit"+(owned.has(u.slug)?" owned":"")+(invest.has(u.slug)?" invest":"");
  b.innerHTML=`<span class="dot"></span>`+(u.cls&&CLASS_ICON[u.cls]?`<img class="cicon" src="${CLASS_ICON[u.cls]}" alt="${u.cls}" title="${titleCase(u.cls)}">`:"")+`<span class="nm"></span>`+(u.rarity?`<span class="rar"></span>`:"")+
    `<span class="flag" role="button" tabindex="0" title="Flag to invest" aria-label="Flag ${u.name} to invest">${FLAG_SVG}</span>`;
  b.querySelector(".nm").textContent=u.name;
  if(u.rarity) b.querySelector(".rar").textContent=u.rarity;
  b.setAttribute("aria-pressed", owned.has(u.slug));

  b.onclick=()=>{ owned.has(u.slug)?owned.delete(u.slug):owned.add(u.slug);
    b.classList.toggle("owned"); b.setAttribute("aria-pressed", owned.has(u.slug));
    b.setAttribute("aria-label", u.name+(owned.has(u.slug)?" (owned)":""));
    saveKey("dt_owned",owned); afterChange(); };
  const flag=b.querySelector(".flag");
  const toggleInvest=ev=>{ ev.stopPropagation();
    invest.has(u.slug)?invest.delete(u.slug):invest.add(u.slug);
    b.classList.toggle("invest"); flag.setAttribute("aria-pressed", invest.has(u.slug));
    saveKey("dt_invest",invest); afterChange(); };
  flag.setAttribute("aria-pressed", invest.has(u.slug));

  flag.onkeydown=ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); toggleInvest(ev); } };
  b.onmouseenter=e=>showTip(e,u); b.onmousemove=moveTip; b.onmouseleave=hideTip;

function deleteSavedTeam(idx){ savedTeams.splice(idx,1); saveJSON("dt_saved_teams", savedTeams); renderTeams(); }
function cellAllowed(cls,idx){
  const row=Math.floor(idx/3);              // 0 = front (top), 1 = middle, 2 = back (bottom)
  if(cls==="guardian") return row===0;      // front only
  if(cls==="assassin") return true;         // anywhere
  if(cls==="warrior"||cls==="archer"||cls==="mage"||cls==="priest") return row>=1; // middle/back
  return true;                              // unknown class: unrestricted
}
function placementMsg(cls){
  return cls==="guardian" ? "Guardians can only go in the front row."
    : titleCase(cls)+"s go in the middle or back row, not the front.";
}
function placeUnit(f,i,slug){
  if(!slug) return;
  const u=MODEL.bySlug[slug]; const cls=u?u.cls:"";
  if(!cellAllowed(cls,i)){ toast(placementMsg(cls)); return; }
  const board=teams[f]; const at=board.indexOf(slug);
  if(!board[i] && at<0 && board.filter(Boolean).length>=6){ toast("A board can hold up to 6 characters."); return; }
  if(at>=0 && at!==i) board[at]=null;       // move within the same board
  board[i]=slug; selectedPoolSlug=null; saveTeams(); renderTeams();
}
function moveOrSwap(sf,si,tf,ti){
  if(sf===tf && si===ti) return;
  const srcSlug=teams[sf][si]; if(!srcSlug) return;
  if(sf!==tf){ placeUnit(tf,ti,srcSlug); return; }   // dragged to a different board: place a copy
  const board=teams[tf]; const tgtSlug=board[ti];
  const clsOf=s=>{ const u=MODEL.bySlug[s]; return u?u.cls:""; };
  const srcCls=clsOf(srcSlug);
  if(tgtSlug){                                        // swap the two units
    const tgtCls=clsOf(tgtSlug);
    if(!cellAllowed(srcCls,ti)){ toast(placementMsg(srcCls)); return; }
    if(!cellAllowed(tgtCls,si)){ toast(placementMsg(tgtCls)); return; }
    board[ti]=srcSlug; board[si]=tgtSlug;
  } else {                                            // move to an empty slot
    if(!cellAllowed(srcCls,ti)){ toast(placementMsg(srcCls)); return; }
    board[ti]=srcSlug; board[si]=null;
  }
  selectedPoolSlug=null; saveTeams(); renderTeams();
}
function cellEl(f,i){
  const cell=document.createElement("div"); cell.className="cell"; const slug=teams[f][i];

    cell.classList.add(cellAllowed(scls,i)&&capOk ? "ok" : "no");

    if(d.from==="cell") moveOrSwap(d.f,d.i,f,i); else if(d.slug) placeUnit(f,i,d.slug); };
  cell.onclick=()=>{ if(teams[f][i]){ teams[f][i]=null; saveTeams(); renderTeams(); }

      `<span class="cu">${u?u.name:parseSlug(slug).name}</span>`;

/* ---- faction coverage matrix ---- */
const ABBR={sanctum_glory:"SG", wild_spirit:"WS", arcane_wisdom:"AW", otherworld_return:"OR", elemental_echo:"EE", illusion_veil:"IV"};
const ANALYTICS={cutoff:null, ownedOnly:false};
function coverColor(p){ return "rgba(224,163,62,"+(0.06+0.55*p/100).toFixed(3)+")"; }
function analyze(){
  const list=currentList();
  const defIdx=Math.min(2, list.tierOrder.length-1);
  const cutoffIdx=Math.min(ANALYTICS.cutoff!=null?ANALYTICS.cutoff:defIdx, list.tierOrder.length-1);
  let hi=MODEL.units.filter(u=>{ const i=list.tierOrder.indexOf(list.tierOf[u.slug]); return i>=0 && i<=cutoffIdx; });
  if(ANALYTICS.ownedOnly) hi=hi.filter(u=>owned.has(u.slug));
  const H=hi.filter(u=>u.factions.length>0);
  const total=H.length;
  const matrix=FACTIONS.map(a=>FACTIONS.map(b=>{
    let n=0; H.forEach(u=>{ if(u.factions.includes(a)||u.factions.includes(b)) n++; }); return n;
  }));
  const singles=FACTIONS.map(f=>({facs:[f], n:H.filter(u=>u.factions.includes(f)).length}));
  singles.sort((x,y)=>y.n-x.n);
  const pairs=[];
  for(let i=0;i<FACTIONS.length;i++) for(let j=i+1;j<FACTIONS.length;j++)
    pairs.push({facs:[FACTIONS[i],FACTIONS[j]], n:matrix[i][j]});
  pairs.sort((x,y)=>y.n-x.n);
  const triples=[];
  for(let i=0;i<FACTIONS.length;i++) for(let j=i+1;j<FACTIONS.length;j++) for(let k=j+1;k<FACTIONS.length;k++){
    const a=FACTIONS[i],b=FACTIONS[j],c=FACTIONS[k]; let n=0;
    H.forEach(u=>{ if(u.factions.includes(a)||u.factions.includes(b)||u.factions.includes(c)) n++; });
    triples.push({facs:[a,b,c], n});
  }
  triples.sort((x,y)=>y.n-x.n);
  return {list, cutoffIdx, total, matrix, singles, pairs, triples, hiCount:hi.length, withFacCount:H.length};
}
function renderAnalytics(){
  const el=$("analytics"); const A=analyze(); const fn=titleCase;
  const pct=n=>A.total?Math.round(n/A.total*100):0;
  const dot=f=>`<span class="fdot" style="background:${FACTION_COLOR[f]}"></span>`;
  const facLabel=f=>dot(f)+fn(f);
  let h=`<div class="ahead"><div><h2>Faction coverage matrix</h2></div>`+
    `<div class="acontrols"><label class="asel">High tier <select id="cutoffSel"></select></label>`+
    `<button class="toggle small" id="scopeBtn" aria-pressed="${ANALYTICS.ownedOnly}">Owned only</button></div></div>`;
  if(A.total===0){
    h+=`<p class="anote">No high-tier units with known faction data in scope. `+
       (A.withFacCount<A.hiCount?`Add the full characters.json to load factions for the whole roster.`:``)+`</p>`;
    el.innerHTML=h; wireControls(A); return;
  }
  h+=`<div class="matrixwrap"><table class="matrix"><thead><tr><th></th>`;
  FACTIONS.forEach(f=>{ h+=`<th title="${fn(f)}">${dot(f)}${ABBR[f]}</th>`; });
  h+=`</tr></thead><tbody>`;
  FACTIONS.forEach((a,i)=>{
    h+=`<tr><th title="${fn(a)}">${dot(a)}${ABBR[a]}</th>`;
    FACTIONS.forEach((b,j)=>{
      const n=A.matrix[i][j], p=pct(n), diag=i===j;
      h+=`<td class="${diag?"diag":""}" style="background:${coverColor(p)}" `+
         `title="${diag?fn(a):fn(a)+" + "+fn(b)}: ${n} of ${A.total} high-tier units (${p}%)">${p}<span class="pcts">%</span></td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  h+=`<div class="combos">`+
     `<div class="combo"><h3>Single factions</h3><ol>`+
       A.singles.map(s=>`<li><span>${facLabel(s.facs[0])}</span><b>${pct(s.n)}%</b></li>`).join("")+
     `</ol></div>`+
     `<div class="combo"><h3>All pairs (${A.pairs.length})</h3><ol>`+
       A.pairs.map(p=>`<li><span>${p.facs.map(facLabel).join(" + ")}</span><b>${pct(p.n)}%</b></li>`).join("")+
     `</ol></div>`+
     `<div class="combo"><h3>All trios (${A.triples.length})</h3><ol>`+
       A.triples.map(t=>`<li><span>${t.facs.map(facLabel).join(" + ")}</span><b>${pct(t.n)}%</b></li>`).join("")+
     `</ol></div>`+
     `</div>`;
  if(A.withFacCount<A.hiCount)
    h+=`<p class="anote">Faction data is in the snapshot for only ${A.withFacCount} of ${A.hiCount} high-tier units in scope — the full characters.json fills in the rest.</p>`;
  el.innerHTML=h; wireControls(A);
}
function wireControls(A){
  const sel=$("cutoffSel");
  if(sel){ sel.innerHTML="";
    if(!A.list.tierOrder.includes("SS")){
      const o=document.createElement("option");
      o.textContent="\u2265 SS \u2014 not ranked in this list"; o.disabled=true;
      sel.appendChild(o);
    }
    A.list.tierOrder.forEach((t,idx)=>{ const o=document.createElement("option");
      o.value=idx; o.textContent="\u2265 "+t; if(idx===A.cutoffIdx) o.selected=true; sel.appendChild(o); });
    sel.onchange=()=>{ ANALYTICS.cutoff=+sel.value; renderAnalytics(); };
  }
  const sb=$("scopeBtn");
  if(sb) sb.onclick=()=>{ ANALYTICS.ownedOnly=!ANALYTICS.ownedOnly; renderAnalytics(); };
}

const tip=$("tip");

/* ---- live refresh ---- */
async function loadData(){
  const tl = await fetch(DATA.tiers,{cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error("tier-lists.json ("+r.status+")"); return r.json(); });
  let ch=[];
  try{ ch = await fetch(DATA.chars,{cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; return r.json(); }); }
  catch(e){ /* characters.json is optional enrichment (factions, classes); tiers still work without it */ }
  MODEL=buildModel(tl,ch);
  if(!MODEL.lists.find(l=>l.name===selectedList)) selectedList=(MODEL.lists[0]||{}).name;
}
async function refresh(){
  const btn=$("refresh"); btn.disabled=true; btn.textContent="Checking\u2026";
  const hadModel=!!MODEL;
  const before=hadModel ? new Set(MODEL.units.map(u=>u.slug)) : new Set();
  try{
    await loadData();
    const added=MODEL.units.filter(u=>!before.has(u.slug));
    renderAll();
    const t=new Date().toLocaleTimeString();
    if(!hadModel){
      $("datastate").innerHTML="Loaded "+MODEL.units.length+" units<br>"+t;
      toast("Loaded "+MODEL.units.length+" units.");
    } else if(added.length){
      const names=added.slice(0,4).map(u=>u.name).join(", ");
      $("datastate").innerHTML="Updated \u2014 "+added.length+" new<br>"+t;
      toast("Refresh complete \u2014 "+added.length+" new unit"+(added.length>1?"s":"")+": "+names+(added.length>4?"\u2026":""));
    } else {
      $("datastate").innerHTML="Up to date<br>"+t;
      toast("Refresh complete \u2014 no new units ("+MODEL.units.length+" total).");
    }
  }catch(e){
    if(hadModel){ $("datastate").innerHTML="<b style='color:#e05a3e'>Refresh failed</b><br>"+new Date().toLocaleTimeString();
      toast("Refresh failed \u2014 couldn't reach the data files. Showing what was already loaded."); }
    else showDataError(e);
  }
  btn.disabled=false; btn.textContent="Refresh";
}
function showDataError(e){
  $("datastate").innerHTML="<b style='color:#e05a3e'>Data not loaded</b>";
  const host=$("bands");
  if(host) host.innerHTML=`<div class="empty">Couldn't load ${String(e.message||e)}. `+
    `This page reads <b>tier-lists.json</b> and <b>characters.json</b> from its own folder \u2014 they need to sit next to it. `+
    `That's the case when it's hosted; a file opened on its own or a plain preview won't have them.</div>`;
}

function applyViewVisibility(){
  const roster = view!=="matrix";
  $("bands").style.display = roster?"":"none";
  $("analytics").classList.toggle("show", view==="matrix");
  $("listnote").style.display = view==="tiers"?"":"none";
  $("searchbox").style.display = roster?"":"none";
  $("ownedOnly").style.display = roster?"":"none";
  $("investOnly").style.display = roster?"":"none";
  $("filtergroups").style.display = roster?"":"none";
  $("listseg").style.display = (view==="tiers"||view==="matrix")?"":"none";
  document.querySelectorAll(".vtab").forEach(t=>t.setAttribute("aria-pressed", t.dataset.view===view));
}
function renderAll(){
  renderListSeg(); renderNote(); applyViewVisibility();
  renderView();
  renderStats();
}

/* ---- export / import (simple, forward-compatible, slug-keyed) ---- */
function exportData(){
  const units={};
  const rec=s=>units[s]=units[s]||{};
  owned.forEach(s=>{ rec(s).o=1; });
  invest.forEach(s=>{ rec(s).i=1; });
  FACTIONS.forEach(f=>teams[f].forEach((slug,pos)=>{ if(slug){ const u=rec(slug); (u.t=u.t||[]).push([f,pos]); } }));
  const data={format:"dtroster", version:1, exported:new Date().toISOString(), units};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="dt-roster-backup.json"; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(a.href);
  toast("Exported "+Object.keys(units).length+" units.");
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let data; try{ data=JSON.parse(reader.result); }catch(e){ toast("Couldn't read that file \u2014 is it a dt-roster backup?"); return; }
    const units=data&&data.units; if(!units||typeof units!=="object"){ toast("That file has no roster data."); return; }
    owned=new Set(); invest=new Set(); teams=emptyTeams();
    let n=0;
    Object.keys(units).forEach(slug=>{        // unknown slugs are kept harmlessly; they render if the character returns
      const r=units[slug]||{}; n++;
      if(r.o) owned.add(slug);
      if(r.i) invest.add(slug);
      (r.t||[]).forEach(p=>{ const f=p&&p[0], pos=p&&p[1]; if(teams[f] && pos>=0 && pos<9) teams[f][pos]=slug; });
    });
    saveKey("dt_owned",owned); saveKey("dt_invest",invest); saveTeams();
    renderAll();
    toast("Imported "+n+" units.");
  };
  reader.readAsText(file);
}

/* ---- boot ---- */
(async function(){
  owned=await loadKey("dt_owned");
  invest=await loadKey("dt_invest");
  const savedBoards=await loadJSON("dt_teams", null);
  teams=emptyTeams();
  if(savedBoards) FACTIONS.forEach(f=>{ if(Array.isArray(savedBoards[f])) for(let i=0;i<9;i++) teams[f][i]=savedBoards[f][i]||null; });
  savedTeams=await loadJSON("dt_saved_teams", []);
  if(!Array.isArray(savedTeams)) savedTeams=[];
  renderRarityFilter();
  $("search").oninput=e=>{ filters.search=e.target.value.trim().toLowerCase(); renderView(); };
  $("ownedOnly").onclick=e=>{ filters.ownedOnly=!filters.ownedOnly; e.currentTarget.setAttribute("aria-pressed",filters.ownedOnly); renderView(); };
  $("investOnly").onclick=e=>{ filters.investOnly=!filters.investOnly; e.currentTarget.setAttribute("aria-pressed",filters.investOnly); renderView(); };
  document.querySelectorAll(".vtab").forEach(tab=>{ tab.onclick=()=>{ view=tab.dataset.view; renderAll(); }; });
  $("refresh").onclick=refresh;
  $("exportBtn").onclick=exportData;
  $("importBtn").onclick=()=>$("importFile").click();
  $("importFile").onchange=e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=""; };
  try{
    await loadData(); renderAll();
    $("datastate").innerHTML="Loaded "+MODEL.units.length+" units<br>"+new Date().toLocaleTimeString();
  }catch(e){ showDataError(e); }
})();
</script>
